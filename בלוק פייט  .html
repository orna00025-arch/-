<title>BLOCK FIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen 3D arena; HUD pinned to the corners; menus are dark glass cards over the world */
:root {
  --ink: #14122b;
  --panel: rgba(22, 19, 48, .86);
  --line: rgba(255, 255, 255, .14);
  --sun: #ffd23f;
  --sky: #4cc9f0;
  --grape: #8a3ffc;
  --hp: #5be36b;
  --sh: #3fa7ff;
  --text: #fffaf0;
  --muted: #c9c3e6;
  --danger: #ff4d6d;
  --display: "Secular One", "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --body: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--ink); color: var(--text); font-family: var(--body); }
#app { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; touch-action: none; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: var(--body); cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.tl, .tr, .bl, .br { position: absolute; display: flex; flex-direction: column; gap: 6px; }
.tl { top: calc(env(safe-area-inset-top, 0px) + 12px); left: calc(env(safe-area-inset-left, 0px) + 12px); align-items: flex-start; }
.tr { top: calc(env(safe-area-inset-top, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px); align-items: flex-end; }
.bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px); width: min(260px, 40vw); }
.br { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 14px); align-items: flex-end; }
.pill { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 14px; font-variant-numeric: tabular-nums; display: flex; gap: 12px; align-items: center; }
.pill b { font-family: var(--display); font-weight: 400; font-size: 18px; }
#stormTxt { color: #d9c2ff; }
#stormTxt.in { color: #fff; background: rgba(138, 63, 252, .85); }
.hudbtns { display: flex; gap: 8px; pointer-events: auto; }
.hudbtns button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 14px; }
#adminTag { background: var(--sun); color: var(--ink); border-radius: 8px; padding: 3px 10px; font-size: 12px; font-weight: 700; max-width: 46vw; }
.bar { position: relative; height: 18px; background: rgba(0,0,0,.45); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.bar i { position: absolute; inset: 0 auto 0 0; display: block; transition: width .15s; }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
#shFill { background: var(--sh); }
#hpFill { background: var(--hp); }
.mats { display: flex; gap: 6px; }
.mat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 13px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.mat b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; }
.mat.sel { border-color: var(--sun); box-shadow: 0 0 0 2px rgba(255, 210, 63, .35) inset; }
#hotbar { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; max-width: 96vw; gap: 5px; direction: ltr; pointer-events: auto; }
.slot { width: 66px; height: 58px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 6px; box-sizing: border-box; font-size: 11px; position: relative; }
.slot .k { position: absolute; top: 2px; left: 5px; font-size: 10px; color: var(--muted); }
.slot .n { font-weight: 700; line-height: 1.1; padding-top: 10px; }
.slot .a { font-variant-numeric: tabular-nums; color: var(--muted); }
.slot.on { border-color: var(--sun); transform: translateY(-4px); }
.slot .r { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; border-radius: 0 0 8px 8px; }
#cross { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); line-height: 0; filter: drop-shadow(0 0 1.5px rgba(0,0,0,.9)); }
#hitm { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; }
#hitm::before, #hitm::after { content: ""; position: absolute; background: #fff; }
#hitm::before { left: 16px; top: 0; width: 2px; height: 34px; }
#hitm::after { top: 16px; left: 0; height: 2px; width: 34px; }
#hitm.on { opacity: 1; }
#hitm.kill::before, #hitm.kill::after { background: var(--danger); }
#scope { position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0 32vmin, rgba(0,0,0,.92) 32.3vmin); }
#scope::before, #scope::after { content: ""; position: absolute; background: rgba(0,0,0,.8); }
#scope::before { left: 50%; top: 0; bottom: 0; width: 1px; }
#scope::after { top: 50%; left: 0; right: 0; height: 1px; }
#buildTag { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--sky); color: #dff7ff; border-radius: 10px; padding: 6px 14px; font-size: 14px; white-space: nowrap; }
#reloadTag { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font-size: 14px; background: var(--panel); padding: 3px 12px; border-radius: 8px; }
#downTag { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); background: rgba(255, 77, 109, .85); color: #fff; font-size: 17px; font-weight: 700; padding: 8px 18px; border-radius: 12px; text-align: center; max-width: 86vw; }
#tRevive { width: 70px; height: 70px; right: calc(env(safe-area-inset-right, 0px) + 200px); bottom: calc(env(safe-area-inset-bottom, 0px) + 170px); background: rgba(76, 201, 240, .7) !important; }
#fzMenu { position: absolute; left: 50%; top: calc(50% + 40px); transform: translateX(-50%); pointer-events: auto; background: linear-gradient(160deg, rgba(20, 60, 90, .95), rgba(14, 24, 52, .95)); border: 2px solid #7fe7ff; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 260px; box-shadow: 0 0 30px rgba(127, 231, 255, .35); }
#fzTitle { font-family: var(--display); font-size: 18px; text-align: center; color: #dff9ff; margin-bottom: 2px; }
#fzMenu button { background: rgba(255,255,255,.08); border: 1px solid rgba(127, 231, 255, .4); border-radius: 10px; padding: 8px 12px; font-size: 15px; text-align: start; display: flex; gap: 10px; align-items: center; }
#fzMenu button:hover { background: rgba(127, 231, 255, .22); }
#fzMenu kbd { background: #7fe7ff; color: #06202a; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-family: var(--body); }
#toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 18px; font-size: 16px; text-align: center; max-width: 80vw; }
#feed { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 110px); right: calc(env(safe-area-inset-right, 0px) + 12px); display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
#feed div { background: rgba(0,0,0,.5); padding: 3px 10px; border-radius: 6px; font-size: 13px; }
#feed b { color: var(--sun); font-weight: 500; }
#vign { position: absolute; inset: 0; box-shadow: inset 0 0 120px 30px rgba(255, 30, 60, .0); transition: box-shadow .25s; }
#vign.hurt { box-shadow: inset 0 0 120px 30px rgba(255, 30, 60, .55); transition: none; }
#stormTint { position: absolute; inset: 0; background: rgba(120, 50, 230, .22); }
#frozenTint { position: absolute; inset: 0; background: rgba(140, 220, 255, .28); box-shadow: inset 0 0 120px rgba(220, 250, 255, .9); pointer-events: none; }
.menusec { border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 10px 14px; margin: 10px 0; background: rgba(255,255,255,.03); }
.menusec h3 { margin: 2px 0 8px; }
.toolrow { flex-wrap: wrap; gap: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0 12px; }
.tabs .chip.on { background: var(--accent, #ffd23f); color: #1a1a1a; }
[data-tab] .sec:first-child { margin-top: 0; }
.lbcode { font-size: 46px; font-weight: 900; letter-spacing: 10px; margin: 4px 0 8px; color: #ffd23f; font-variant-numeric: tabular-nums; }
.lbrow { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.06); margin: 4px 0; }
.padfocus { outline: 3px solid #ffd23f !important; outline-offset: 2px; }
.frzrow button.on { background: #7fe7ff; color: #06202a; }
#dmgLayer { position: absolute; inset: 0; overflow: hidden; }
.num { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 22px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6); animation: up .8s ease-out forwards; white-space: nowrap; }
.num.sh { color: #8fd0ff; } .num.hd { color: var(--sun); font-size: 26px; } .num.mat { color: #ffe0b8; font-size: 16px; font-family: var(--body); font-weight: 700; } .num.pk { color: var(--hp); font-size: 16px; font-family: var(--body); font-weight: 700; }
@keyframes up { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -46px; } }

/* ---------- touch ---------- */
#touchUI { position: absolute; inset: 0; pointer-events: none; }
#touchUI button { pointer-events: auto; position: absolute; border-radius: 50%; background: rgba(22, 19, 48, .62); border: 2px solid rgba(255,255,255,.3); font-size: 13px; font-weight: 700; touch-action: none; }
#touchUI button.on { background: rgba(255, 210, 63, .8); color: var(--ink); }
#tFire { width: 84px; height: 84px; right: calc(env(safe-area-inset-right, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); background: rgba(255, 77, 109, .6) !important; font-size: 16px !important; }
#tJump { width: 64px; height: 64px; right: calc(env(safe-area-inset-right, 0px) + 116px); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
#tAim { width: 58px; height: 58px; right: calc(env(safe-area-inset-right, 0px) + 112px); bottom: calc(env(safe-area-inset-bottom, 0px) + 172px); }
#tReload { width: 52px; height: 52px; right: calc(env(safe-area-inset-right, 0px) + 36px); bottom: calc(env(safe-area-inset-bottom, 0px) + 214px); }
#tDown { width: 58px; height: 58px; right: calc(env(safe-area-inset-right, 0px) + 184px); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); }
.tbuild { right: calc(env(safe-area-inset-right, 0px) + 14px); width: 54px; height: 54px; }
#tWall { bottom: calc(env(safe-area-inset-bottom, 0px) + 446px); } #tFloor { bottom: calc(env(safe-area-inset-bottom, 0px) + 386px); } #tRamp { bottom: calc(env(safe-area-inset-bottom, 0px) + 326px); } #tMat { bottom: calc(env(safe-area-inset-bottom, 0px) + 266px); right: calc(env(safe-area-inset-right, 0px) + 100px) !important; }
#joy { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.18); transform: translate(-50%, -50%); }
#knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.55); }
@media (pointer: coarse) {
  #hotbar { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 54px); }
  .slot { width: 46px; height: 46px; font-size: 9px; }
  .bl { width: min(200px, 38vw); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
  .br { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 110px); }
  #buildTag { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 112px); }
}

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; overflow-y: auto; background: linear-gradient(160deg, rgba(20,18,43,.55), rgba(20,18,43,.88)); display: flex; justify-content: center; align-items: flex-start; padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 24px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; touch-action: pan-y; }
.menu-wrap { width: 100%; max-width: 1080px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 20px; margin: auto 0; }
@media (max-width: 760px) { .menu-wrap { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-sizing: border-box; min-width: 0; }
.eyebrow { color: var(--sky); font-size: 13px; letter-spacing: .08em; font-weight: 700; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 7vw, 66px); line-height: 1; margin: 8px 0 10px; color: var(--sun); text-shadow: 0 4px 0 #b3541e; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0 0 8px; text-wrap: balance; }
h3 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
h3 .hint { color: var(--danger); letter-spacing: 0; font-weight: 500; }
.lead { color: var(--muted); line-height: 1.6; margin: 0 0 16px; max-width: 46ch; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.lbl { color: var(--muted); font-size: 14px; min-width: 6em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 14px; }
.chip.on { background: var(--sky); color: var(--ink); border-color: var(--sky); font-weight: 700; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.swatch.on { border-color: var(--sun); box-shadow: 0 0 0 2px var(--sun); }
.big { font-family: var(--display); font-size: 26px; background: var(--sun); color: var(--ink) !important; border: 0; border-radius: 14px; padding: 12px 34px; box-shadow: 0 5px 0 #b3541e; }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #b3541e; }
.ghost { background: transparent; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 18px; font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
#skinGrid, #pickGrid { max-height: 430px; overflow-y: auto; padding: 4px; touch-action: pan-y; }
.item { background: rgba(255,255,255,.05); border: 2px solid transparent; border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; }
.item.on { border-color: var(--sun); background: rgba(255, 210, 63, .1); }
.item small { color: var(--muted); font-size: 11px; }
.fig { display: flex; flex-direction: column; align-items: center; gap: 2px; height: 74px; justify-content: flex-end; }
.fig i { display: block; border-radius: 3px; }
.pickfig { height: 74px; display: flex; align-items: center; justify-content: center; }
.gunfig { height: 34px; display: flex; align-items: center; justify-content: center; }
.gunfig b { display: block; height: 12px; border-radius: 3px; position: relative; }
.gunfig b::after { content: ""; position: absolute; left: 30%; top: 10px; width: 9px; height: 12px; background: inherit; border-radius: 0 0 3px 3px; opacity: .7; }
.help { margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.8; }
.help summary { cursor: pointer; color: var(--text); font-weight: 500; }
kbd { background: rgba(255,255,255,.12); border-radius: 5px; padding: 1px 6px; font-family: var(--body); font-size: 12px; color: var(--text); }
.center { width: 100%; max-width: 480px; margin: auto 0; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.center .lead { margin: 0 auto; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 15px; text-align: start; cursor: pointer; }
.switch small { display: block; color: var(--muted); font-size: 12px; }
.switch input { width: 46px; height: 26px; accent-color: var(--sun); flex: none; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
form { display: flex; gap: 8px; }
input[type=password] { flex: 1; min-width: 0; font-family: var(--body); font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: rgba(0,0,0,.3); color: var(--text); user-select: text; -webkit-user-select: text; text-align: center; letter-spacing: .2em; }
.err { color: var(--danger); font-size: 14px; }
.online { margin-top: 6px; padding-top: 4px; border-top: 1px solid var(--line); }
.txt { font-family: var(--body); font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: rgba(0,0,0,.3); color: var(--text); user-select: text; -webkit-user-select: text; min-width: 0; width: 11em; }
.txt.code { width: 7em; text-transform: lowercase; letter-spacing: .15em; text-align: center; font-family: var(--display); font-size: 18px; }
.codebig { font-family: var(--display); font-size: 26px; color: var(--sun); letter-spacing: .15em; user-select: all; -webkit-user-select: all; }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 6px 0 0; max-width: 52ch; }
#onPill { pointer-events: none; font-size: 13px; }
.aibtn { border-color: var(--grape); color: #e3d4ff !important; }
#aiIn { width: 100%; box-sizing: border-box; font-family: var(--body); font-size: 16px; line-height: 1.5; padding: 12px; border-radius: 12px; border: 1.5px solid var(--grape); background: rgba(0,0,0,.3); color: var(--text); resize: vertical; user-select: text; -webkit-user-select: text; }
.aiout { min-height: 1.6em; font-size: 15px; line-height: 1.6; color: #e3d4ff; white-space: pre-wrap; }
.aiout.err { color: var(--danger); }
.json { direction: ltr; text-align: left; font-size: 12px; max-height: 220px; overflow: auto; background: rgba(0,0,0,.35); padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text; }
.stat-line { font-size: 18px; font-variant-numeric: tabular-nums; }
.setrow { display: flex; flex-direction: column; gap: 8px; text-align: start; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
.setrow input[type=range] { width: 100%; accent-color: var(--sun); }
.setrow b { color: var(--sun); font-weight: 500; margin-inline-start: 6px; }
.sec { font-size: 13px; letter-spacing: .08em; color: var(--sky); font-weight: 700; text-align: start; margin-top: 10px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.lrow { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.lrow span { flex: 1; min-width: 0; }
.lrow .pv { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.4); border-radius: 8px; flex: none; }
.lrow select, .keybtn { font-family: var(--body); font-size: 14px; background: rgba(0,0,0,.3); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.keybtn { min-width: 84px; }
.keybtn.wait { border-color: var(--sun); color: var(--sun); }
@media (prefers-reduced-motion: reduce) { .num { animation-duration: .01s; } .bar i { transition: none; } }
/* ---------- BLOCK FIGHT theme: night-arena look, gold + cyan accents ---------- */
.screen { background: radial-gradient(1200px 700px at 15% -10%, rgba(138, 63, 252, .35), transparent 60%), radial-gradient(900px 600px at 110% 110%, rgba(76, 201, 240, .25), transparent 60%), linear-gradient(160deg, rgba(12, 10, 30, .72), rgba(12, 10, 30, .93)); }
.card { background: linear-gradient(180deg, rgba(40, 33, 86, .92), rgba(18, 15, 42, .94)); border: 1px solid rgba(255, 255, 255, .12); border-top: 3px solid var(--sun); border-radius: 20px; box-shadow: 0 18px 50px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08); }
h1 { font-size: clamp(46px, 8vw, 78px); letter-spacing: .02em; background: linear-gradient(180deg, #fff3b0 0%, #ffd23f 45%, #ff9f1c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 4px 0 #8a3b12) drop-shadow(0 10px 18px rgba(255, 159, 28, .35)); }
h2 { color: #fff3c4; text-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.eyebrow { background: rgba(76, 201, 240, .14); border: 1px solid rgba(76, 201, 240, .45); border-radius: 999px; padding: 3px 12px; }
.menusec { background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02)); border: 1px solid rgba(255, 255, 255, .1); border-radius: 16px; }
.menusec h3, .sec { color: var(--sky); }
.big { background: linear-gradient(180deg, #ffe066, #ffb703); box-shadow: 0 5px 0 #a8480f, 0 10px 24px rgba(255, 183, 3, .3); transition: transform .08s, filter .15s; }
.big:hover { filter: brightness(1.08); transform: translateY(-1px); }
.ghost { background: rgba(255, 255, 255, .04); transition: background .15s, border-color .15s, transform .08s; }
